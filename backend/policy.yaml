# AgentShield — central control catalog (single source of truth).
# The gateway polls this file: save it and the new policy is live in < 1 s.
# Invalid / empty edits are rejected; the last good version keeps enforcing.
# Removing a control section DISABLES that control. `flow` stays on unless flow.enabled: false.

version: "2026.10.03"
mode: enforce            # enforce | monitor (log what WOULD be blocked)
profile: standard  # dev | standard | strict
fail_mode: closed        # judge unavailable on grey-zone traffic: closed = block, open = allow
require_auth: true
block_response: error    # error = HTTP 403 JSON | message = 200 with refusal text
max_input_chars: 40000
approval_ttl_s: 120

controls:
  prompt_injection:
    enabled: true
    action: block
    direction: input
    block_threshold: 0.80     # deterministic score >= this -> block, no LLM call
    review_threshold: 0.30    # [review, block) -> grey zone -> semantic judge
    scan_tool_results: true   # indirect injection hidden in documents / tool outputs
  pii:
    enabled: true
    action: redact
    direction: both
    entities: [EMAIL, PHONE, PESEL, NIP, IBAN, CREDIT_CARD]
  secrets:
    enabled: true
    action: block
    direction: both
  signatures:
    enabled: true
    action: block
    direction: both
    feed_file: feeds/signatures.yaml   # externally managed threat feed, hot reloaded
  canary:
    enabled: true
    action: block
    direction: output
    tokens: ["WRDN-CANARY-7F3A"]
  loop:
    enabled: true
    action: block
    max_identical: 3
    window_seconds: 120
    max_requests_per_session: 60

flow:                      # information-flow guard: independent of the detectors above
  enabled: true
  min_chars: 12
  rules:
    secret_to_egress: block              # F1: secret tool output leaving via an egress tool
    untrusted_value_as_target: block     # F2: recipient / URL / IBAN taken from untrusted content
    untrusted_before_irreversible: approval

semantic:                  # AI-based layer, grey zone only
  enabled: true
  backend: openrouter      # openrouter | openai | ollama | heuristic | stub
  model: google/gemini-2.5-flash-lite
  fallback_model: openai/gpt-4o-mini
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  trigger: suspicious
  threshold: 0.70
  timeout_ms: 1200
  breaker_failures: 3
  breaker_cooldown_s: 30
  usd_per_day: 1.00        # the guard's own spend is budgeted too
  action: block
  scan_output: false
  denied_topics:
    - material non-public information about listed companies
    - personalised investment advice

models:
  mock/vulnerable-llm:     # deterministic offline model for demos and tests
    upstream: mock
    input_per_1m: 3.00
    output_per_1m: 15.00
  openrouter/openai/gpt-4o-mini:
    upstream: openrouter
    upstream_model: openai/gpt-4o-mini
    input_per_1m: 0.15
    output_per_1m: 0.60
  openrouter/google/gemini-2.5-flash-lite:
    upstream: openrouter
    upstream_model: google/gemini-2.5-flash-lite
    input_per_1m: 0.10
    output_per_1m: 0.40
  ollama/qwen2.5:3b:
    upstream: ollama
    upstream_model: qwen2.5:3b
    base_url: http://localhost:11434/v1
    compute_usd_per_second: 0.0004

budgets:
  default:
    usd_per_day: 2.00
    tokens_per_minute: 40000
    requests_per_minute: 120
    max_tokens_per_request: 4000
    compute_seconds_per_day: 900
    warn_at: 0.80

agents:
  - id: bank-ops-agent
    api_key: wk_bank_ops_demo
    description: Back-office assistant with customer and payment tools
    allowed_models: [mock/vulnerable-llm, openrouter/openai/gpt-4o-mini]
    allowed_tools: [lookup_customer, read_document, send_email, transfer_funds]
    budget:
      usd_per_day: 0.50
      max_tokens_per_request: 2000
  - id: research-agent
    api_key: wk_research_demo
    description: Read-only research assistant
    allowed_tools: [read_document]
  - id: judge-sandbox
    api_key: wk_judge
    description: Key for the jury (no tools)
    budget:
      usd_per_day: 1.00
  - id: budget-demo
    api_key: wk_budget_demo
    description: Zero budget, to show budget enforcement
    budget:
      usd_per_day: 0

tools:
  lookup_customer:
    labels: [secret]
  read_document:
    labels: [untrusted]
  send_email:
    egress: true
    target_args: [to]
    arg_patterns:
      to: '^[\w.+-]+@bank\.example$'
  transfer_funds:
    egress: true
    irreversible: true
    target_args: [iban]
    max_values:
      amount: 10000

mcp_servers:
  bank-tools:
    url: asgi://demo

kill_switch: []

profiles:
  dev:
    mode: monitor
    fail_mode: open
  standard: {}
  strict:
    controls:
      pii:
        action: block
      prompt_injection:
        block_threshold: 0.60
        review_threshold: 0.15
    semantic:
      trigger: always
      threshold: 0.50
