# AgentShield sample — dev
# Reference: docs/POLICY_REFERENCE.md
# What you read is what parse_policy enforces. The profiles.dev overlay is empty
# on purpose, so this file does not hide a second copy of the rules.
# This is not the live catalog. The process loads backend/policy.yaml unless
# AGENTSHIELD_POLICY or POST /api/policy points it here.
#
# Posture: watch, do not stop. mode monitor rewrites block, redact, and
# require_approval findings to monitor and prefixes the detail with
# would_<action>, then forwards the text. It does not downgrade auth.*,
# budget.*, model.*, limits.*, or tools.kill_switch. fail_mode open means a
# dead judge on grey-zone traffic is a monitor finding, not a block.
# Detector actions stay at the standard values (PII redact, secrets block) so
# the audit shows what enforce mode would have done.
# The judge is the offline heuristic. No API key, no network.

version: "2026.10.03-dev"
mode: monitor
profile: dev
fail_mode: open
require_auth: true
block_response: error
max_input_chars: 80000          # larger paste budget while iterating
approval_ttl_s: 300             # time to approve a payment from a laptop

controls:
  prompt_injection:
    enabled: true
    action: block               # monitor mode records would_block
    direction: input
    block_threshold: 0.80       # same scores as standard, so the log is comparable
    review_threshold: 0.30
    scan_tool_results: true
  pii:
    enabled: true
    action: redact              # monitor mode records would_redact and does not mask
    direction: both
    entities: [EMAIL, PHONE, PESEL, NIP, IBAN, CREDIT_CARD]
  secrets:
    enabled: true
    action: block
    direction: both
  signatures:
    enabled: true
    action: block
    direction: both
    feed_file: feeds/signatures.yaml   # resolved from the policy dir, else backend/feeds/
  canary:
    enabled: true
    action: block
    direction: output
    tokens: ["WRDN-CANARY-7F3A"]
  loop:
    enabled: true
    action: block
    max_identical: 5            # a developer resending a prompt should not trip at 3
    window_seconds: 120
    max_requests_per_session: 200

flow:                           # not a detector; still on in this file
  enabled: true
  min_chars: 12
  rules:
    secret_to_egress: block
    untrusted_value_as_target: block
    untrusted_before_irreversible: approval

semantic:
  enabled: true
  backend: heuristic           # keyword + denied_topics; works with no key
  model: heuristic
  fallback_model: null
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  trigger: suspicious          # grey zone only; monitor mode then downgrades a block
  threshold: 0.70
  timeout_ms: 1200
  breaker_failures: 3
  breaker_cooldown_s: 30
  usd_per_day: 1.00            # 0 would make every call return status budget
  action: block
  scan_output: false
  denied_topics:
    - material non-public information about listed companies
    - personalised investment advice

models:
  mock/vulnerable-llm:
    upstream: mock
    input_per_1m: 3.00
    output_per_1m: 15.00
  openrouter/openai/gpt-4o-mini:
    upstream: openrouter
    upstream_model: openai/gpt-4o-mini
    input_per_1m: 0.15
    output_per_1m: 0.60
  openrouter/google/gemini-2.5-flash-lite:
    upstream: openrouter
    upstream_model: google/gemini-2.5-flash-lite
    input_per_1m: 0.10
    output_per_1m: 0.40
  ollama/qwen2.5:3b:           # local model allowed here; not in the stricter samples
    upstream: ollama
    upstream_model: qwen2.5:3b
    base_url: http://localhost:11434/v1
    compute_usd_per_second: 0.0004

budgets:
  default:                     # generous; agent blocks below only replace listed fields
    usd_per_day: 20.00
    tokens_per_minute: 200000
    requests_per_minute: 600
    max_tokens_per_request: 8000
    compute_seconds_per_day: 7200
    warn_at: 0.90              # late warning; this profile is for iteration

agents:
  - id: bank-ops-agent
    api_key: wk_bank_ops_demo
    description: Back-office assistant. allowed_models omitted, so every model above is allowed.
    allowed_tools: [lookup_customer, read_document, send_email, transfer_funds]
    budget:
      usd_per_day: 5.00
  - id: research-agent
    api_key: wk_research_demo
    description: Read-only research assistant. Inherits the default budget.
    allowed_tools: [read_document]
  - id: judge-sandbox
    api_key: wk_judge
    description: Jury key. allowed_tools omitted means no tools.
    budget:
      usd_per_day: 2.00
  - id: budget-demo
    api_key: wk_budget_demo
    description: Small non-zero cap so monitor mode is visible. A zero cap would 429 even in monitor mode.
    budget:
      usd_per_day: 0.25

tools:
  lookup_customer:
    labels: [secret]           # result is tainted; copying it into an egress tool is flow.secret_egress
  read_document:
    labels: [untrusted]
  send_email:
    egress: true
    target_args: [to]
    arg_patterns:
      to: '^[\w.+-]+@bank\.example$'
  transfer_funds:
    egress: true
    irreversible: true         # human approval, unless monitor mode downgrades it to would_require_approval
    target_args: [iban]
    max_values:
      amount: 10000

mcp_servers:
  bank-tools:
    url: asgi://demo           # schema only; this tree does not start an MCP server

kill_switch: []

profiles:
  dev: {}                      # body above is already the dev posture
