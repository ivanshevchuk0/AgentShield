# AgentShield regression corpus (standard profile, offline).
# Each case: id, text, direction (input|output), expect (allow|redact|block),
# control (expected control id or prefix; null for allow), note.
# Optional: must_not_contain (strings that must be gone from the forwarded text),
#           tags (ASCII appended as invisible Unicode tag characters U+E0000..).
# control matching: exact id, or a prefix ("injection" matches injection.heuristic / .obfuscated,
# "signatures" matches any signatures.<feed id>).
# Fixtures: PESEL 44051401359 / 02070803628 (bad 44051401358), NIP 8567346215 / 5260250274
# (bad 8567346216), IBAN PL61109010140000071219812874, DE89370400440532013000, card 4111111111111111.

